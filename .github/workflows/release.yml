name: Release

# 推送 v* 标签即自动发布：
#   1) 构建多架构应用镜像并推送到 ghcr.io/<仓库>
#   2) 生成面向使用者的分发压缩包，并创建 GitHub Release 附带该压缩包
#
# 也可在 Actions 页面手动触发（workflow_dispatch）并填写版本号。
#
# 前置条件：
#   - 仓库 Settings → Actions → General → Workflow permissions 选择 "Read and write permissions"，
#     或确保下方 permissions 生效（本文件已显式声明）。
#   - 首次发布后，到仓库的 Packages 页面把 ghcr 包可见性设为 Public，
#     接收方才能免登录 docker compose pull。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.1.0）'
        required: true

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送镜像到 ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本号与镜像名
        id: vars
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE"   >> "$GITHUB_OUTPUT"

      - name: 启用 QEMU（构建 arm64 镜像）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成分发压缩包
        run: bash deploy/make-bundle.sh "${{ steps.vars.outputs.image }}" "${{ steps.vars.outputs.version }}"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.vars.outputs.version }}" \
            "dist/bidguard-${{ steps.vars.outputs.version }}.tar.gz" \
            --title "${{ steps.vars.outputs.version }}" \
            --generate-notes
