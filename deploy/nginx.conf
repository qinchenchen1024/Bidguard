# BidGuard 内置 API 网关
# 作用：supabase-js 会把 REST 请求发到 {URL}/rest/v1/<table>，
#       而 PostgREST 直接挂在根路径，故用本网关把 /rest/v1/* 前缀转发给内置 PostgREST。
# 仅在 compose 内网使用（不对宿主机暴露端口）。

server {
    listen 8000;
    server_name _;

    # 供容器健康检查使用
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # /rest/v1/documents -> http://rest:3000/documents
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Authorization / apikey 等请求头默认透传，无需显式设置

        # 大文件解析出的正文可能较大，放开请求体与超时限制
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
