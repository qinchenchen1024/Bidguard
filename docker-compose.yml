# =============================================================================
#  BidGuard 一体化自托管包（开箱即用）
#  内置：PostgreSQL 数据库 + PostgREST 接口 + 内置网关 + 应用 + 本地免费智能体(Ollama)
#
#  首次使用（三步）：
#    1) 生成密钥并创建配置：  node deploy/gen-keys.mjs > .env
#    2) 启动全部服务：        docker compose up -d --build
#    3) 首次拉取本地模型：    docker compose exec ollama ollama pull qwen2.5:7b
#       然后浏览器打开：      http://localhost:3000
#
#  为什么自托管：本项目需处理百 MB 级文件与长任务，超出 Vercel 等 Serverless
#  平台（请求体 4.5MB / 时长为默认上限）的能力边界，故设计为本机 / VPS / 内网自托管。
#
#  分发给他人使用：
#    - 发布者：./deploy/build-and-push.sh ghcr.io/<账号>/bidguard:latest 推送到镜像仓库。
#    - 接收方：将 .env 中 BIDGUARD_IMAGE 设为该镜像地址，然后
#              docker compose pull && docker compose up -d
#              （无需本地源码与 Node 环境；但需保留 docker-compose.yml、.env、
#                deploy/ 与 supabase/migrations/ 这些文件，数据库首次启动要用到）
#
#  数据持久化：命名卷 db-data（数据库）、ollama-models（模型）。
#             注意 docker compose down -v 会连数据一并删除。
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先执行 node deploy/gen-keys.mjs > .env 生成 .env}
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/postgresql/data
      # 仅在数据卷为空时执行一次，按文件名顺序自动建库结构
      - ./deploy/init/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./supabase/migrations/0001_init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./supabase/migrations/0002_grants.sql:/docker-entrypoint-initdb.d/20-grants.sql:ro
      - ./supabase/migrations/0003_responsiveness_and_learning.sql:/docker-entrypoint-initdb.d/30-learning.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v14.18
    environment:
      # 单机自托管：以超级用户连接内置库；实际权限由 JWT 中的 role(anon/service_role) 决定
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?请先执行 node deploy/gen-keys.mjs > .env 生成 .env}
      PGRST_SERVER_PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    # 把 supabase-js 约定的 /rest/v1/* 转发给内置 PostgREST（仅内网）
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rest
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    # 使用预构建镜像时把 BIDGUARD_IMAGE 指向镜像仓库；否则用本地构建的 bidguard:local
    image: ${BIDGUARD_IMAGE:-bidguard:local}
    build: .
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://gateway:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?请先执行 node deploy/gen-keys.mjs > .env 生成 .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?请先执行 node deploy/gen-keys.mjs > .env 生成 .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      TZ: Asia/Shanghai
      # 默认走内置 Ollama；可在网页右上角「模型设置」中改为自带云端模型
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      gateway:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  db-data:
  ollama-models:
